<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Varshit Kumar | Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

body{
background:#0b1120;
color:white;
overflow-x:hidden;
}

header{
position:fixed;
top:0;
left:0;
width:100%;
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(15,23,42,.85);
backdrop-filter:blur(15px);
z-index:1000;
border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
font-size:30px;
font-weight:700;
}

.logo span{
color:#3b82f6;
}

nav a{
text-decoration:none;
color:white;
margin-left:35px;
font-weight:500;
transition:.3s;
}

nav a:hover{
color:#3b82f6;
}

.resume{
padding:10px 22px;
border:2px solid #3b82f6;
border-radius:30px;
}

.hero{

min-height:100vh;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 8%;
background:linear-gradient(135deg,#0b1120,#111827,#020617);

}

.left img{

width:420px;
border-radius:50%;
border:6px solid #2563eb;
box-shadow:0 0 70px rgba(59,130,246,.4);

}

.right{

max-width:650px;

}

.right h3{

font-size:32px;
color:#60a5fa;

}

.right h1{

font-size:75px;
margin:15px 0;

}

.right h1 span{

color:#3b82f6;

}

.right h2{

font-size:28px;
font-weight:500;
margin-bottom:20px;

}

.right p{

line-height:1.8;
font-size:18px;
color:#d1d5db;
margin-bottom:35px;

}

.buttons{

display:flex;
gap:20px;

}

.btn{

display:inline-block;
padding:15px 35px;
border-radius:40px;
text-decoration:none;
font-weight:600;
transition:.3s;

}

.primary{

background:#2563eb;
color:white;

}

.secondary{

border:2px solid #2563eb;
color:white;

}

.btn:hover{

transform:translateY(-5px);

}

.social{

margin-top:35px;

}

.social a{

display:inline-flex;
justify-content:center;
align-items:center;
width:48px;
height:48px;
margin-right:15px;
border-radius:50%;
background:#1e293b;
color:white;
font-size:20px;
transition:.3s;

}

.social a:hover{

background:#2563eb;

}

@media(max-width:950px){

.hero{

flex-direction:column;
text-align:center;
padding-top:120px;

}

.left img{

width:300px;
margin-bottom:40px;

}

.right h1{

font-size:50px;

}

header{

flex-direction:column;

}

nav{

margin-top:20px;

}

nav a{

margin:10px;

}

}

</style>

</head>

<body>

<header>

<div class="logo">Varshit <span>Kumar</span></div>

<nav>

<a href="#">Home</a>
<a href="#">About</a>
<a href="#">Skills</a>
<a href="#">Projects</a>
<a href="#">Contact</a>
<a href="#" class="resume">Resume</a>

</nav>

</header>

<section class="hero">

<div class="left">

<img src="profile.jpg" alt="Profile">

</div>

<div class="right">

<h3>Hello, I'm</h3>

<h1>Varshit <span>Kumar</span></h1>

<h2>Web Developer | CSE Student</h2>

<p>
I build beautiful, modern and responsive websites using HTML,
CSS and JavaScript. I love creating clean UI and solving real-world
problems through technology.
</p>

<div class="buttons">

<a href="#" class="btn primary">Get Started</a>

<a href="#" class="btn secondary">Contact Me</a>

</div>

<div class="social">

<a href="#"><i class="fab fa-github"></i></a>

<a href="#"><i class="fab fa-linkedin"></i></a>

<a href="#"><i class="fab fa-instagram"></i></a>

<a href="#"><i class="fas fa-envelope"></i></a>

</div>

</div>

</section>

</body>
</html>
